<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0d0f12;
            background-image: 
                radial-gradient(at 20% 20%, rgba(0, 136, 204, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(255, 71, 87, 0.12) 0px, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 3px;
            background: linear-gradient(90deg, #0088cc, #ff4757, #0088cc);
            animation: borderSlide 4s linear infinite;
        }

        @keyframes borderSlide {
            0% { transform: translateX(-30%); }
            100% { transform: translateX(30%); }
        }

        /* RENDERE LA FOTO PERFETTAMENTE ROTONDA */
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0088cc;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.5);
            margin-bottom: 20px;
        }

        .badge-discount {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.4);
            color: #ff4757;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .badge-discount::before {
            content: "🔥";
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #b0b8c4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #9da8b6;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-telegram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background: linear-gradient(135deg, #0088cc 0%, #006699 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 18px 24px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.35);
            transition: all 0.3s ease;
        }

        .btn-telegram:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 136, 204, 0.5);
            background: linear-gradient(135deg, #0099e6 0%, #0077b3 100%);
        }

        .btn-telegram svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
